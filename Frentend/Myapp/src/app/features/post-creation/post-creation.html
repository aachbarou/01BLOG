<main class="post-creation-container">
  <div class="header-section">
      <h1 class="main-title">Create a New Post</h1>
      <p class="subtitle">Share your ideas with the community.</p>
  </div>

  <form (ngSubmit)="createPost()" #postForm="ngForm" class="post-form-card">
      <div class="form-group">
          <label for="title" class="form-label">Title</label>
          <input type="text" id="title" name="title" [(ngModel)]="title" required 
              class="text-input title-input" 
              placeholder="Enter an engaging title...">
      </div>

      <!-- <div class="form-group">
          <label for="description" class="form-label">Summary</label>
          <textarea id="description" name="description" [(ngModel)]="description" required rows="2" 
              class="text-input textarea-input" 
              placeholder="What is this post about?"></textarea>
      </div> -->

      <div class="form-group">
          <label class="form-label">Cover Media</label>
          <div class="media-upload-zone">
              <input type="file" id="media" (change)="onFileSelected($event)" accept="image/*,video/*" class="file-input">
              <div id="drop-zone" class="drop-zone-content">
                  <div id="upload-prompt" class="upload-prompt-content">
                      <div class="upload-icon-wrapper">
                          <i class="upload-icon">📁</i>
                      </div>
                      <p class="upload-text"><span class="font-bold">Click to upload</span> or drag and drop</p>
                      <p class="upload-hint">Images or MP4 (MAX. 100MB)</p>
                  </div>
                  
                  <div id="file-preview" class="file-preview hidden">
                      <div class="preview-content">
                          <img id="image-render" class="preview-media hidden" alt="Image preview">
                          <video id="video-render" class="preview-media hidden" controls></video>
                          <p id="file-name" class="preview-file-name"></p>
                      </div>
                      
                      <button type="button" (click)="clearFile($event)" class="clear-file-btn">
                          <span>✕</span>
                      </button>
                  </div>
              </div>
          </div>
      </div>

      <div class="form-group">
          <label for="content" class="form-label">Story</label>
          <textarea id="content" name="content" [(ngModel)]="content" required rows="10" 
              class="text-input textarea-input large-textarea" 
              placeholder="Tell your story..."></textarea>
      </div>

      <div class="action-buttons-group">
          <button type="button" class="draft-btn">Save Draft</button>
          <button type="submit" class="publish-btn" [disabled]="!postForm.form.valid || isLoading">
              @if (!isLoading) {
                <span>Publish</span>
              } @else {
                <span class="spinner"></span>
              }
          </button>
      </div>
      @if (errorMessage) {
        <div class="error-message">{{ errorMessage }}</div>
      }
  </form>
</main>
