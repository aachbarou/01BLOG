<div class="edit-layout animate-fade-in">
  <header class="edit-header">
    <div class="header-left">
      <button (click)="goBack()" class="btn-circle-nav">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <div class="divider-v"></div>
      <span class="room-label">Editing Post</span>
    </div>

    <div class="header-right">
      <button (click)="isPreview = !isPreview" [class.active-mode]="isPreview" class="btn-mode-toggle">
        @if (isPreview) { <span>Edit Mode</span> } 
        @else { <span>View Preview</span> }
      </button>
      <button (click)="updatePost()" [disabled]="isLoading" class="btn-publish-main">
        {{ isLoading ? 'UPDATING...' : 'UPDATE POST' }}
      </button>
    </div>
  </header>

  <main class="form-body">
    @if (!isPreview) {
      <div class="editor-stack animate-slide-up">
        <textarea 
          placeholder="Story Title..." 
          [(ngModel)]="postData.title"
          class="title-textarea" 
          rows="1"></textarea>

        <div class="media-frame-modern">
           @if (postData.mediaUrl) {
              <div class="preview-wrapper">
                @if (isVideo(postData.mediaUrl)) {
                  <video [src]="getMediaUrl(postData.mediaUrl)" controls class="media-object"></video>
                } @else {
                  <img [src]="getMediaUrl(postData.mediaUrl)" class="media-object" alt="Cover">
                }
                <button (click)="postData.mediaUrl = ''" class="btn-remove-media">×</button>
              </div>
           } @else {
              <div class="upload-placeholder">
                 <div class="icon-box-premium">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                 </div>
                 <span class="upload-hint">Media URL (Image or Video)</span>
                 <input type="text" [(ngModel)]="postData.mediaUrl" placeholder="Paste URL here..." class="url-input-styled">
              </div>
           }
        </div>

        <textarea 
          placeholder="Tell your story..." 
          [(ngModel)]="postData.content"
          class="content-textarea-main"
          rows="15"></textarea>
      </div>
    } @else {
      <div class="preview-container animate-zoom-in">
         <div class="mock-post-card">
            <h1 class="preview-title">{{ postData.title || 'Untitled Story' }}</h1>
            <div class="preview-media-box" *ngIf="postData.mediaUrl">
                <img *ngIf="!isVideo(postData.mediaUrl)" [src]="getMediaUrl(postData.mediaUrl)">
                <video *ngIf="isVideo(postData.mediaUrl)" [src]="getMediaUrl(postData.mediaUrl)" controls></video>
            </div>
            <p class="preview-text-content">{{ postData.content }}</p>
         </div>
      </div>
    }
  </main>
</div>
