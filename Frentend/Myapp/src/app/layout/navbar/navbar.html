<nav class="navbar">
    <div class="navbar-container">
        
        <div class="nav-brand" (click)="rerender()">
            <div class="brand-logo-box">01</div>
            <span class="brand-text">BLOG</span>
        </div>

        <div class="nav-actions">
            
            <button class="btn-icon">
                <i data-lucide="search" style="width: 20px; height: 20px;"></i>
            </button>

            <button class="btn-write" (click)="navigateToPostCreation()">
                <i data-lucide="pen-square" class="icon"></i>
                <span>Write</span>
            </button>

            <div class="divider"></div>

            <div class="profile-dropdown-container">
                <button class="profile-trigger" (click)="profileToggle()">
                    <div class="user-info">
                        <span class="user-name">{{ username }}</span>
                        <span class="user-role">Member</span>
                    </div>
                    
                    <div class="avatar-wrapper">
                        <img [src]="imageUrl" alt="User" class="avatar-img">
                        <div class="status-dot"></div>
                    </div>
                </button>

                @if (isDropdownOpen) {
                    <div class="dropdown-menu">
                        <div class="dropdown-header">
                            <p class="header-label">Signed in as</p>
                            <p class="header-email">simo@example.com</p>
                        </div>
                        
                        <a (click)="navigateToProfile()" class="dropdown-item">
                            <i data-lucide="user"></i> Profile
                        </a>
                        <a class="dropdown-item">
                            <i data-lucide="bookmark"></i> Saved
                        </a>
                        <a class="dropdown-item">
                            <i data-lucide="settings"></i> Settings
                        </a>
                        
                        <div class="dropdown-separator"></div>
                        
                        <button (click)="logout()" class="dropdown-item logout-btn">
                            <i data-lucide="log-out"></i> Sign out
                        </button>
                    </div>
                }
            </div>

        </div>
    </div>
</nav>
