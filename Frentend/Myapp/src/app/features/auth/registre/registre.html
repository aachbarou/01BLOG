<div class="nav-placeholder"></div>

<div class="register-wrapper">
    <div class="register-card">
        
        <div class="card-header">
            <div class="brand-icon">S</div>
            <h2 class="join-title">Join 01BLOG</h2>
            <p class="subtitle">Create an account to start your journey.</p>
        </div>

        <form (ngSubmit)="register()">
            
            <div class="form-stack">
                <div>
                    <input 
                        type="text" 
                        name="name" 
                        [(ngModel)]="name" 
                        class="input-field" 
                        placeholder="Full Name" 
                        required>
                </div>

                <div>
                    <input 
                        type="email" 
                        name="email" 
                        [(ngModel)]="email" 
                        class="input-field" 
                        placeholder="Email address" 
                        required>
                </div>

                <div>
                    <input 
                        type="password" 
                        name="password" 
                        [(ngModel)]="password" 
                        class="input-field" 
                        placeholder="Password" 
                        required>
                </div>

                <div>
                    <input 
                        type="password" 
                        name="confirmPassword" 
                        [(ngModel)]="confirmPassword" 
                        class="input-field" 
                        placeholder="Confirm Password" 
                        required>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <span>Create Account</span>
                
                </button>

            @if (error) {
                <p class="error-msg">{{ error }}</p>
            }
        </form>

        <div class="social-divider">
            <div class="divider-line"></div>
            <span class="divider-text">Or join with</span>
        </div>

        <div class="social-actions">
            <button class="social-btn-circle">G</button>
            <button class="social-btn-circle">A</button>
        </div>

        <p class="card-footer">
            Already have an account? 
            <a (click)="onSignupClick()" class="signin-link">Sign In.</a>
        </p>

    </div>
</div>
