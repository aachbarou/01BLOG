<div class="home-container">
  <section class="hero-card">
    <div class="hero-content">
      <h1 class="hero-title">A space for your most creative ideas.</h1>
      <p class="hero-text">Discover stories and insights from writers across the technical world.</p>
      <button (click)="goCreate()" class="hero-cta">Start writing now</button>
    </div>
    <div class="hero-decoration"></div>
  </section>

  <div class="feed-header">
    <button class="feed-tab active">For You</button>
    <button class="feed-tab">Trending</button>
  </div>

  <main class="main-content">
    <div class="posts-list">
      @for (post of posts; track post.id) {
        <app-post [post]="post"></app-post>
      } @empty {
        <div class="empty-state">
          <div class="empty-icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" class="empty-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
            </svg>
          </div>
          <div class="empty-text">
            <h3>No posts yet</h3>
            <p>Be the first to share your thoughts with the community.</p>
          </div>
          <button (click)="goCreate()" class="btn-subscribe" style="max-width: 200px;">
            Create Post
          </button>
        </div>
      }
    </div>
  </main>
</div>
