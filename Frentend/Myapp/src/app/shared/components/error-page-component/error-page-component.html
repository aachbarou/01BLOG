<div class="error-container animate-fade-in">
  <div class="visual-deco-layer">
    <div class="orb amber-blur"></div>
    <div class="orb stone-blur"></div>
  </div>

  <div class="central-content">
    
    <div class="error-hero-stack">
      <h1 class="background-ghost-code">{{ errorConfig.code }}</h1>
      
      <div class="foreground-status">
         <svg class="alert-svg-bounce" xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
            <path d="M12 9v4"/><path d="M12 17h.01"/>
         </svg>
         <h2 class="error-main-title">{{ errorConfig.title }}</h2>
      </div>
    </div>
    
    <p class="error-sub-text">{{ errorConfig.message }}</p>

    <div class="button-action-group">
      <button (click)="goHome()" class="btn-modern-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Return to Feed
        <svg class="chevron-slide" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>

    <div class="error-footer-links">
       <a href="#">Support</a>
       <span class="sep">•</span>
       <a href="#">Status</a>
       <span class="sep">•</span>
       <a href="#">API Docs</a>
    </div>
  </div>
</div>
