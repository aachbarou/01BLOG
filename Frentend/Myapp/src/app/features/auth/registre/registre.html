<div class="register-container">
  <div class="register-header">
    <div class="logo">S</div>
    <h2>01Blog<br>Register</h2>
  </div>

  <form (ngSubmit)="register()">
     <div class="form-group">
      <input type="text" id="name" name="name" [(ngModel)]="name" placeholder="Full Name" required>
    </div>
    <div class="form-group">
      <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Email Address" required>
    </div>
    <div class="form-group">
      <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Password" required>
    </div>
     <div class="form-group">
      <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="Confirm Password" required>
    </div>

    <button type="submit" class="register-button">Create Account</button>
    <p class="Error">{{this.error}}</p>
  </form>

  <div class="divider">OR</div>

  <div class="social-login">
    <button class="social-btn google">G</button>
    <button class="social-btn apple">A</button>
  </div>

  <div class="register-footer">
    <p>Already have an account? <a (click)="onSignupClick()">Sign In.</a></p>
  </div>
</div>
