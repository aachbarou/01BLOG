<div class="glass-card post-container" [class.video-mode]="post.mediaUrl?.endsWith('.mp4') || showComments">
  
  <div class="post-text-content">
    <div class="post-header">
      <div class="author-info">
        <img [src]="'https://ui-avatars.com/api/?name=' + (post.user?.username || 'User')" alt="Avatar" class="avatar">
        <div class="author-details">
          <span class="author-name">{{ post.user?.username || 'Unknown' }}</span>
          <span class="post-date">{{ post.timestamp }}</span>
        </div>
      </div>
    </div>
    <div class="post-content">
      <p>{{ post.content }}</p>
    </div>
  </div>

  @if (post.mediaUrl) {
    <div class="image-wrapper">
      @if (post.mediaUrl.endsWith('.mp4')) {
        <video [src]="post.mediaUrl" controls class="main-video"></video>
      } @else {
        <img [src]="post.mediaUrl" alt="Post Media">
      }
    </div>
  }

  <div class="post-actions">
    <div class="actions-wrapper">
      <button class="action-btn like-btn" (click)="isLiked = !isLiked" [class.liked]="isLiked">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" [attr.fill]="isLiked ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
        </svg>
        <span>{{ isLiked ? (post.likes || 0) + 1 : (post.likes || 0) }}</span>
      </button>

      <button class="action-btn comment-btn" (click)="toggleComments()" [class.active]="showComments">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" [attr.fill]="showComments ? 'rgba(245, 158, 11, 0.1)' : 'none'" stroke="currentColor" stroke-width="2">
          <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
        </svg>
        <span>{{ post.comments || 0 }}</span>
      </button>
    </div>

    @if (showComments) {
      <div class="comments-section-container animate-slide-down">
        <div class="comments-list">
          @for (comment of mockComments; track comment.id) {
            <app-comment-item [comment]="comment"></app-comment-item>
          } @empty {
            <p class="empty-comments">No comments yet. Be the first to share your thoughts!</p>
          }
        </div>

        <div class="comment-input-area">
          <img src="https://ui-avatars.com/api/?name=Simo+6&background=random" class="user-avatar-small" alt="me">
          <div class="input-relative">
            <input type="text" [(ngModel)]="newCommentText" placeholder="Write a comment..." class="comment-input-field">
            <button class="send-comment-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
