<div class="post-creation-container">
  <h2>Create a New Post</h2>
  <form (ngSubmit)="createPost()" #postForm="ngForm">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" [(ngModel)]="title" required>
    </div>
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" [(ngModel)]="description" required></textarea>
    </div>
    <div class="form-group">
      <label for="content">Content</label>
      <textarea id="content" name="content" [(ngModel)]="content" required></textarea>
    </div>
    <div class="form-group">
      <label for="media">Image or Video</label>
      <input type="file" id="media" (change)="onFileSelected($event)" accept="image/*,video/*">
    </div>
    @if (errorMessage) {
      <div class="error-message">
        {{ errorMessage }}
      </div>
    }
    <button type="submit" [disabled]="!postForm.form.valid || isLoading">
      @if (!isLoading) {
        <span>Create Post</span>
      } @else {
        <app-loading></app-loading>
      }
    </button>
  </form>
</div>
