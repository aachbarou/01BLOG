<div class="login-container">
  <div class="login-header">
    <div class="logo">01</div>
    <h2>01Blog <br> Login</h2>
  </div>
  <form (ngSubmit)="login()">
    <div class="form-group">
      <input type="text" id="email" name="email" [(ngModel)]="email" placeholder="Email">
    </div>
    <div class="form-group">
      <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Password">
    </div>
    <button type="submit" class="login-button">Sign In</button>
    @if (LoginError) { <div class="error-message"> {{ ErrorMessage }}
    </div>
    }
  </form>

  <div class="divider">OR</div>

  <div class="social-login">
    <button class="social-btn google">G</button>
    <button class="social-btn apple">A</button>
    <button class="social-btn other">X</button>
  </div>

  <div class="login-footer">
    <p>Don't have an account? <a (click)="showregister()">Register</a> </p>
    <a  class="forgot-password" (click)="resetpass()">Forgot password?</a>
  </div>
</div>
