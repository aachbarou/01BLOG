<div class="settings-page-root animate-fade-in">
  <div class="settings-nav-header">
    <button (click)="goBack()" class="back-navigation-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    </button>
    <div class="header-text-container">
      <h1 class="settings-title">Profile Settings</h1>
      <p class="settings-subtitle">PERSONALIZE YOUR IDENTITY</p>
    </div>
  </div>

  <form (ngSubmit)="handleSave()" class="modern-settings-form">
    <div class="identity-photo-card">
      <div class="avatar-edit-wrapper">
        <div class="avatar-frame">
          <img [src]="formData.avatarUrl" alt="User Photo">
        </div>
        <div class="orange-edit-badge">
           <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
        </div>
      </div>
      <div class="photo-labels">
        <h3 class="photo-title">Your Photo</h3>
        <p class="photo-action-text">UPDATE YOUR IMAGE</p>
      </div>
    </div>

    <div class="info-fields-card">
      <div class="dual-input-grid">
        <div class="input-stack">
          <label class="field-label">DISPLAY NAME</label>
          <input type="text" [(ngModel)]="formData.name" name="name" class="styled-text-input" placeholder="Name">
        </div>
        <div class="input-stack">
          <label class="field-label">USERNAME</label>
          <div class="prefixed-input-box">
            <span class="at-prefix">@</span>
            <input type="text" [(ngModel)]="formData.username" name="username" class="styled-text-input has-prefix" placeholder="username">
          </div>
        </div>
      </div>

      <div class="input-stack">
        <label class="field-label">BIO</label>
        <textarea [(ngModel)]="formData.bio" name="bio" rows="5" class="styled-textarea" placeholder="Tell us about yourself..."></textarea>
      </div>

      <div class="input-stack">
        <label class="field-label">PERSONAL WEBSITE</label>
        <div class="icon-input-box">
          <svg class="globe-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
          <input type="url" [(ngModel)]="formData.website" name="website" class="styled-text-input has-icon" placeholder="https://yourwebsite.com">
        </div>
      </div>
    </div>

    <div class="settings-footer-actions">
      <button type="button" (click)="goBack()" class="btn-discard-action">DISCARD</button>
      <button type="submit" [disabled]="isSaving" class="btn-save-confirm">
        {{ isSaving ? 'SAVING...' : 'SAVE CHANGES' }}
      </button>
    </div>
  </form>
</div>
