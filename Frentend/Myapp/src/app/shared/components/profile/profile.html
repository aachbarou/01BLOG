<div class="profile-container">
  <header class="glass-card profile-header">
    <div class="header-content">
        <img [src]="profile.avatarUrl" alt="{{profile.name}}" class="profile-avatar">
        
        <div class="user-info">
            <div class="name-action-row">
                <h1 class="profile-name">{{ profile.name }}</h1>
                <button class="glass-btn edit-btn">Edit Profile</button>
            </div>
            <p class="profile-bio">{{ profile.bio }}</p>
            
            <div class="profile-stats">
                <div class="stat-box">
                    <span class="stat-num">{{ profile.stats.posts }}</span>
                    <span class="stat-label">Posts</span>
                </div>
                <div class="stat-box">
                    <span class="stat-num">{{ profile.stats.followers }}</span>
                    <span class="stat-label">Followers</span>
                </div>
                <div class="stat-box">
                    <span class="stat-num">{{ profile.stats.following }}</span>
                    <span class="stat-label">Following</span>
                </div>
            </div>
        </div>
    </div>
  </header>

  <div class="profile-tabs">
      <div class="tab-item active">Posts</div>
  </div>

  <main class="profile-feed">
    @for (post of posts; track post.id) {
      <app-post [post]="post"></app-post>
    }
  </main>
</div>
