<div class="glass-card post-container">
  @if (post.mediaUrl) {
  <div class="image-wrapper">
    @if (post.mediaUrl.endsWith('.mp4')) {
    <video [src]="post.mediaUrl" controls style="width: 100%; border-radius: 8px;"></video>
    } @else {
    <img [src]="post.mediaUrl" alt="Post Media">
    }
  </div>
  }

  <div class="post-text-content">
    <div class="post-header">
      <div class="author-info">
        <img [src]="'https://ui-avatars.com/api/?name=' + (post.user?.username || 'User')" alt="Avatar" class="avatar">
        <div class="author-details">
          <span class="author-name">{{ post.user?.username || 'Unknown' }}</span>
          <span class="post-date">{{ post.timestamp }}</span>
        </div>
      </div>
      <!-- <button class="more-options">...</button> -->
    </div>

    <div class="post-content">
      <p>{{ post.content }}</p>
    </div>

    <div class="post-actions">
      <button class="action-btn" [class.liked]="isLiked">
        <span class="icon">❤️</span>
        <span>{{ post.likes || 0 }}</span>
      </button>
      <button class="action-btn">
        <span class="icon">💬</span>
        <span>{{ post.comments || 0 }}</span>
      </button>
    </div>
  </div>
</div>
